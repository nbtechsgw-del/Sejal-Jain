<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EventX</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
  <h2>🎟️ EventX</h2>
  <div>
    <a href="#">Home</a>
    <a href="#">Events</a>
    <a href="#">Contact</a>
    <a href="#" onclick="logout()">Logout</a>
  </div>
</nav>

<!-- HERO -->
<section class="hero">
  <h1>Find Your Next Experience 🎉</h1>
  <p>Concerts, Tech Events, Workshops & more</p>
</section>

<!-- CATEGORY -->
<section class="categories">
  <h2>Categories</h2>
  <div class="cat-box">
    <div>🎵 Music</div>
    <div>💻 Tech</div>
    <div>🎭 Shows</div>
    <div>🎓 Workshops</div>
  </div>
</section>

<!-- CREATE EVENT -->
<section class="event-form">
  <h2>Create Event</h2>
  <input type="text" id="eventName" placeholder="Event Name">
  <input type="text" id="eventDate" placeholder="Date">
  <input type="text" id="eventVenue" placeholder="Venue">
  <input type="number" id="eventPrice" placeholder="Price">
  <button onclick="addEvent()">Add Event</button>
</section>

<!-- EVENTS -->
<section class="container" id="eventContainer"></section>

<section class="attendee-section">
  <h2>🎟️ Attendee List</h2>
  <div id="attendeeList"></div>
</section>

<footer>
  <p>© 2026 EventX | All Rights Reserved</p>
</footer>

<script src="script.js"></script>
</body>
</html>
