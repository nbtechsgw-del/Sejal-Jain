<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Listing</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark mb-4">
  <div class="container">
    <span class="navbar-brand">My Store</span>
  </div>
</nav>

<div class="container">
  <div class="row g-4">

    <!-- Product Card -->
    <div class="col-12 col-md-6 col-lg-3">
      <div class="card h-100">
        <img src="https://via.placeholder.com/300" class="card-img-top">
        <div class="card-body d-flex flex-column">
          <h5>Product 1</h5>
          <p>Nice product description.</p>
          <p class="price">₹999</p>
          <div class="rating">⭐⭐⭐⭐☆</div>
          <button class="btn btn-primary mt-auto add-btn">Add to Cart</button>
        </div>
      </div>
    </div>

    <div class="col-12 col-md-6 col-lg-3">
      <div class="card h-100">
        <img src="https://via.placeholder.com/300" class="card-img-top">
        <div class="card-body d-flex flex-column">
          <h5>Product 2</h5>
          <p>Amazing quality item.</p>
          <p class="price">₹1499</p>
          <div class="rating">⭐⭐⭐⭐⭐</div>
          <button class="btn btn-primary mt-auto add-btn">Add to Cart</button>
        </div>
      </div>
    </div>

  </div>
</div>

<script src="script.js"></script>

</body>
</html>
