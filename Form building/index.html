<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h2>User Registration</h2>

    <form id="form">

        <!-- Personal Details -->
        <div class="section">
            <h3>Personal Details</h3>

            <div class="form-group">
                <label>Name*</label>
                <input type="text" id="name">
                <small class="error"></small>
            </div>

            <div class="form-group">
                <label>Email*</label>
                <input type="email" id="email">
                <small class="error"></small>
            </div>

            <div class="form-group">
                <label>Password*</label>
                <input type="password" id="password">
                <small class="error"></small>
            </div>

            <div class="form-group">
                <label>Confirm Password*</label>
                <input type="password" id="confirm">
                <small class="error"></small>
            </div>

            <label class="show-pass">
                <input type="checkbox" id="showPass"> Show Password
            </label>
        </div>

        <!-- Gender -->
        <div class="section">
            <h3>Gender*</h3>
            <div class="options">
                <label><input type="radio" name="gender"> Male</label>
                <label><input type="radio" name="gender"> Female</label>
            </div>
            <small class="error" id="genderError"></small>
        </div>

        <!-- Skills -->
        <div class="section">
            <h3>Skills*</h3>
            <div class="options">
                <label><input type="checkbox" name="skills"> HTML</label>
                <label><input type="checkbox" name="skills"> CSS</label>
                <label><input type="checkbox" name="skills"> JS</label>
            </div>
            <small class="error" id="skillsError"></small>
        </div>

        <!-- File -->
        <div class="section">
            <h3>Upload</h3>
            <input type="file" id="file">
            <p class="file-name"></p>
        </div>

        <button type="submit">Register</button>
        <p class="success"></p>

    </form>
</div>

<script src="script.js"></script>
</body>
</html>
